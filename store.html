<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Details | PickBly</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        forest: '#1B4D3E',
                        yellowAccent: '#FAEA73',
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 font-sans antialiased text-gray-800">

    <!-- Header / Navbar -->
    <header class="bg-white border-b sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 font-bold text-xl text-forest">
                <i class="fa-solid fa-arrow-left text-sm"></i> Back to PickBly
            </a>
            <span class="text-xs font-semibold bg-emerald-100 text-forest px-3 py-1 rounded-full">Verified Store</span>
        </div>
    </header>

    <!-- Store Banner & Header -->
    <div id="storeHeader" class="relative">
        <div class="h-48 sm:h-64 w-full bg-gray-200 overflow-hidden relative">
            <img id="storeBanner" src="" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-black/30"></div>
        </div>
        
        <div class="max-w-7xl mx-auto px-4 relative z-10 -mt-16 sm:-mt-20 mb-8">
            <div class="bg-white rounded-2xl p-6 shadow-lg border border-gray-100 flex flex-col md:flex-row gap-6 items-start md:items-center justify-between">
                <div class="flex items-center gap-4">
                    <img id="storeLogo" src="" class="w-20 h-20 sm:w-24 sm:h-24 rounded-2xl border-4 border-white shadow-md object-contain bg-white">
                    <div>
                        <h1 id="storeName" class="text-xl sm:text-2xl font-extrabold text-gray-900">Loading Store...</h1>
                        <p id="storeLocation" class="text-xs sm:text-sm text-gray-500 flex items-center gap-1 mt-1">
                            <i class="fa-solid fa-location-dot text-forest"></i> <span>--</span>
                        </p>
                    </div>
                </div>

                <div class="flex flex-wrap gap-2 w-full md:w-auto">
                    <a id="waBtn" href="#" target="_blank" class="flex-1 md:flex-none bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-4 py-2.5 rounded-xl flex items-center justify-center gap-2">
                        <i class="fa-brands fa-whatsapp text-base"></i> WhatsApp
                    </a>
                    <a id="callBtn" href="#" class="flex-1 md:flex-none bg-forest text-yellowAccent font-bold text-xs px-4 py-2.5 rounded-xl flex items-center justify-center gap-2">
                        <i class="fa-solid fa-phone"></i> Call Store
                    </a>
                    <a id="fbBtn" href="#" target="_blank" class="p-2.5 bg-gray-100 text-gray-600 rounded-xl hover:bg-gray-200">
                        <i class="fa-brands fa-facebook-f"></i>
                    </a>
                    <a id="instaBtn" href="#" target="_blank" class="p-2.5 bg-gray-100 text-gray-600 rounded-xl hover:bg-gray-200">
                        <i class="fa-brands fa-instagram"></i>
                    </a>
                </div>
            </div>

            <!-- About Store -->
            <div class="mt-4 bg-white p-4 rounded-xl border border-gray-100">
                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">About Store</h3>
                <p id="storeDesc" class="text-xs sm:text-sm text-gray-600 leading-relaxed">...</p>
            </div>
        </div>
    </div>

    <!-- Store Products Catalog -->
    <main class="max-w-7xl mx-auto px-4 pb-16">
        <h2 class="text-lg font-bold text-gray-900 mb-4 flex items-center gap-2">
            <i class="fa-solid fa-shirt text-forest"></i> Store Collection (<span id="itemCount">0</span>)
        </h2>

        <div id="storeProductsGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
            <div class="col-span-full text-center py-12 text-gray-400 font-medium">
                <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-forest"></i>
                <p>Loading collection...</p>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Get Store Slug from URL query parameter (e.g. store.html?slug=perriallenstore)
        const urlParams = new URLSearchParams(window.location.search);
        const storeSlug = urlParams.get('slug') || 'perriallenstore';

        async function loadStorePage() {
            try {
                // Fetch Store Details
                const { data: store, error: storeErr } = await supabaseClient
                    .from('stores')
                    .select('*')
                    .eq('slug', storeSlug)
                    .single();

                if (store) {
                    document.getElementById('storeName').innerText = store.name;
                    document.getElementById('storeLocation').querySelector('span').innerText = store.location;
                    document.getElementById('storeBanner').src = store.banner_url;
                    document.getElementById('storeLogo').src = store.logo_url;
                    document.getElementById('storeDesc').innerText = store.description;
                    
                    document.getElementById('waBtn').href = `https://wa.me/94${store.phone.substring(1)}?text=Hi%20I%20saw%20your%20items%20on%20PickBly`;
                    document.getElementById('callBtn').href = `tel:${store.phone}`;
                    document.getElementById('fbBtn').href = store.facebook_url;
                    document.getElementById('instaBtn').href = store.instagram_url;
                }

                // Fetch Products for this store
                const { data: products, error: prodErr } = await supabaseClient
                    .from('products')
                    .select('*')
                    .eq('store_slug', storeSlug);

                const grid = document.getElementById('storeProductsGrid');
                if (products && products.length > 0) {
                    document.getElementById('itemCount').innerText = products.length;
                    grid.innerHTML = products.map(item => `
                        <div class="bg-white rounded-2xl overflow-hidden border border-gray-200/80 hover:shadow-lg transition-all flex flex-col group">
                            <div class="relative aspect-square overflow-hidden bg-gray-100">
                                <img src="${item.image_url}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                                <span class="absolute top-2 left-2 bg-forest text-yellowAccent text-[10px] font-bold px-2 py-0.5 rounded">
                                    ${item.category}
                                </span>
                            </div>
                            <div class="p-3.5 flex flex-col flex-grow justify-between space-y-2">
                                <div>
                                    <h3 class="font-bold text-gray-800 text-xs sm:text-sm line-clamp-2">${item.title}</h3>
                                    <p class="text-[11px] text-gray-400 mt-1">Sizes: ${item.available_sizes}</p>
                                </div>
                                <div class="flex items-center justify-between pt-2 border-t border-gray-50">
                                    <span class="text-sm sm:text-base font-extrabold text-forest">${Number(item.price).toLocaleString()} LKR</span>
                                    <a href="https://wa.me/94771218562?text=Hi,%20I%20want%20to%20buy%20${encodeURIComponent(item.title)}" target="_blank" class="bg-emerald-600 text-white font-bold text-xs px-2.5 py-1.5 rounded-lg flex items-center gap-1">
                                        <i class="fa-brands fa-whatsapp"></i> Buy
                                    </a>
                                </div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    grid.innerHTML = `<p class="col-span-full text-center py-8 text-gray-400">No products found for this store.</p>`;
                }
            } catch (err) {
                console.error('Error fetching store:', err);
            }
        }

        document.addEventListener('DOMContentLoaded', loadStorePage);
    </script>
</body>
</html>
